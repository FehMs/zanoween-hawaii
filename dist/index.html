<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="Zanoween × Kawaii. Hawaii Edition, 12.12.26, no Espaço Limão.">
  <title>Zanoween — Hawaii Edition</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fundo.png" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="poster">
    <div class="brands" aria-label="Zanoween em parceria com Kawaii">
      <img class="zanoween" src="assets/zanoween-logo.png" alt="Zanoween 2K26" width="2172" height="724">
      <span class="collab" aria-hidden="true">×</span>
      <span class="kawaii"><span aria-hidden="true">✺</span> kawaii</span>
    </div>

    <div class="headline">
      <h1><img class="edition-logo" src="assets/hawaii-edition.png" alt="Hawaii Edition" width="1983" height="793" fetchpriority="high"></h1>
      <p>O calor vai tomar conta.</p>
    </div>

    <div class="event">
      <p class="event-info">
        <time datetime="2026-12-12">12.12.26</time>
        <span class="divider" aria-hidden="true"></span>
        <span>Espaço Limão</span>
      </p>
      <p class="address-note">Endereço revelado após a compra.</p>
      <!-- Quando a venda abrir, substitua este botão por um link para a bilheteria. -->
      <button class="ticket" type="button" disabled>Ingressos em breve</button>
    </div>
  </main>
</body>
</html>
