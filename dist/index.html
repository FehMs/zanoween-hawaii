<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="Zanoween × Kawaii. Hawaii Edition, 12.12.26, no Espaço Limão.">
  <title>Zanoween — Hawaii Edition</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Montserrat:ital,wght@0,400;0,500;0,600;1,800&family=Shrikhand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="poster">
    <div class="brands" aria-label="Zanoween em parceria com Kawaii">
      <span class="zanoween">ZANOWEEN<small>2 K 2 6</small></span>
      <span class="collab" aria-hidden="true">×</span>
      <span class="kawaii"><span aria-hidden="true">✺</span> kawaii</span>
    </div>

    <div class="headline">
      <h1><span>HAWAII</span><strong>EDITION</strong></h1>
      <p>O calor vai tomar conta.</p>
    </div>

    <div class="event">
      <p class="event-info">
        <time datetime="2026-12-12">12.12.26</time>
        <span class="divider" aria-hidden="true"></span>
        <span>Espaço Limão</span>
      </p>
      <p class="address-note">Endereço revelado após a compra.</p>
      <!-- Quando a venda abrir, substitua este botão por um link para a bilheteria. -->
      <button class="ticket" type="button" disabled>Ingressos em breve</button>
    </div>
